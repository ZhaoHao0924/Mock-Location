name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Build TrollStore IPA
        run: bash Scripts/build-trollstore-ipa.sh

      - name: Validate IPA layout
        run: |
          test -f MockLocation.ipa
          unzip -l MockLocation.ipa | grep -q 'Payload/MockLocation.app/Info.plist'
          unzip -l MockLocation.ipa | grep -q 'Payload/MockLocation.app/PlugIns/MockLocationShare.appex/Info.plist'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MockLocation-TrollStore-IPA
          path: MockLocation.ipa
          if-no-files-found: error
          retention-days: 30
